spring.application.name=backend
server.port=8080

# Valores locais (senha do banco, segredo do JWT) ficam em config/local.properties, fora do Git
spring.config.import=optional:file:./config/local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/financeiro}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Segredo HMAC usado para assinar os tokens (mínimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracao-horas=12
